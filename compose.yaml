services:
  site:
    build: ./frontend
    ports:
      - "8081:80"
    depends_on:
      - api
    restart: unless-stopped
  api:
    build: ./backend
    environment:
      LASTFM_USERNAME: ${LASTFM_USERNAME:-}
      LASTFM_API_KEY: ${LASTFM_API_KEY:-}
      CACHE_SECONDS: ${CACHE_SECONDS:-90}
    restart: unless-stopped
