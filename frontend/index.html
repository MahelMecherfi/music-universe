<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music Universe — Your listening galaxy</title>
<style>
:root{color-scheme:dark;--ink:#f4ead8;--muted:#b7aa91;--panel:#191814;--line:#484135;--gold:#e5b969;--rust:#bd7256;--teal:#75928c}
*{box-sizing:border-box}body{position:relative;isolation:isolate;margin:0;background:#050505;color:var(--ink);font-family:Georgia,"Times New Roman",serif}
body:before{content:"";position:fixed;z-index:-1;inset:-5%;background:linear-gradient(rgba(0,0,0,.24),rgba(0,0,0,.34)),url("/galaxy-background.jpg") center/cover no-repeat;animation:galaxy-drift 70s ease-in-out infinite alternate;will-change:transform}
@keyframes galaxy-drift{from{transform:scale(1) translate3d(-.5%,0,0)}to{transform:scale(1.09) translate3d(.5%,-.5%,0)}}
main{height:calc(100vh - 40px);height:calc(100svh - 40px);position:relative}
 .scene{position:relative;overflow:hidden;background:transparent;height:100%;width:100%}canvas{width:100%;height:100%;display:block;cursor:none}.hint{position:absolute;bottom:17px;left:20px;color:#d0c0a3;font-family:system-ui,sans-serif;font-size:10px;letter-spacing:.08em;pointer-events:none}.status{position:absolute;z-index:2;top:12px;left:16px;padding:8px 11px;color:#d5b77f;background:rgba(5,5,5,.55);font-family:system-ui,sans-serif;font-size:11px;letter-spacing:.06em;pointer-events:none}
 .hover-card{position:absolute;z-index:3;display:grid;grid-template-columns:1fr;gap:10px;width:min(230px,calc(100% - 24px));padding:10px;background:rgba(13,12,9,.88);border:1px solid rgba(226,198,137,.52);box-shadow:0 12px 42px #000b,0 0 30px #dfba6430;backdrop-filter:blur(12px);pointer-events:none;opacity:0;transform:translateY(7px) scale(.98);transition:opacity .2s ease,transform .2s ease}.hover-card.visible{opacity:1;transform:translateY(0) scale(1)}.hover-card img{width:100%;aspect-ratio:1;object-fit:cover;background:radial-gradient(circle,#d4a65d 0 10%,#171510 11% 22%,#080807 23%);box-shadow:0 3px 18px #0009}.hover-copy{min-width:0}.hover-kicker{display:block;color:#d9bd7d;font:9px system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;margin-bottom:5px}.hover-title{display:block;color:#f4ead8;font:17px Georgia,serif;overflow-wrap:anywhere}.hover-artist{display:block;color:#b7aa91;font:11px system-ui,sans-serif;margin-top:4px;overflow-wrap:anywhere}.hover-album{display:block;color:#8f846e;font:10px system-ui,sans-serif;margin-top:3px;overflow-wrap:anywhere}
 .cursor-aura{position:absolute;z-index:2;left:0;top:0;width:118px;height:118px;pointer-events:none;border-radius:50%;opacity:0;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(244,214,155,.2) 0%,rgba(226,185,108,.1) 23%,rgba(212,169,91,.035) 50%,transparent 72%);mix-blend-mode:screen;transition:opacity .25s ease}.cursor-aura.visible{opacity:1}.cursor-spark{position:absolute;left:0;top:0;width:3px;height:3px;pointer-events:none;border-radius:50%;background:#ffe9b7;box-shadow:0 0 8px 2px #eacb8a;opacity:0;transform:translate(-50%,-50%);transition:transform .32s ease,opacity .18s ease}.cursor-spark.visible{opacity:.85}
 @media(hover:none),(pointer:coarse){canvas{cursor:pointer}.cursor-aura,.cursor-spark{display:none}}@media(prefers-reduced-motion:reduce){body:before{animation:none}.hover-card,.cursor-aura,.cursor-spark{transition:none}}
footer{height:40px;display:flex;align-items:center;justify-content:center;padding:0 16px;color:#c0b49c;background:rgba(5,5,5,.72);font-family:system-ui,sans-serif;font-size:10px;letter-spacing:.08em;position:relative;z-index:2}@media(min-width:651px){body{height:100vh;height:100svh;overflow:hidden}}@media(max-width:650px){main{height:auto;min-height:0}.scene{height:160vw;min-height:520px;max-height:none}.hint{left:50%;bottom:10px;transform:translateX(-50%);white-space:nowrap;padding:8px 12px;border:1px solid rgba(226,198,137,.32);border-radius:20px;background:rgba(5,5,5,.78);font-size:9px;letter-spacing:.04em}.status{top:10px;left:50%;transform:translateX(-50%);white-space:nowrap;padding:7px 10px;border:1px solid rgba(226,198,137,.25);border-radius:18px;background:rgba(5,5,5,.7);font-size:10px}footer{height:40px}}
</style></head>
<body>
<main><div class="scene"><canvas id="sky" aria-label="Animated interactive map of album-cover vinyl records representing recently listened artists"></canvas><div class="hover-card" id="hover-card" role="status" aria-live="polite"><img id="hover-cover" alt=""><div class="hover-copy"><span class="hover-kicker">Now in orbit</span><strong class="hover-title" id="hover-title"></strong><span class="hover-artist" id="hover-artist"></span><span class="hover-album" id="hover-album"></span></div></div><div class="cursor-aura" id="cursor-aura"></div><i class="cursor-spark" aria-hidden="true"></i><i class="cursor-spark" aria-hidden="true"></i><i class="cursor-spark" aria-hidden="true"></i><div class="hint">HOVER OR TAP A VINYL TO SEE ITS TRACK</div><div class="status" id="status" role="status">Connecting to your music...</div></div>
</main>
<footer id="username">—</footer>
<script>
const sky=document.getElementById('sky'),scene=sky.parentElement,ctx=sky.getContext('2d'),coverImages=new Map(),fallbackImage=new Image(),motionPreference=window.matchMedia('(prefers-reduced-motion: reduce)'),hoverCard=document.getElementById('hover-card'),hoverCover=document.getElementById('hover-cover'),cursorAura=document.getElementById('cursor-aura'),cursorSparks=[...document.querySelectorAll('.cursor-spark')];let nodes=[],tracks=[],lastFrame=0,animationFrame=0,activeNode=null,pinnedCard=false,positions=[];
const seed=s=>[...s].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);
const noCoverHash='2a96cbd8b46e442fc41c2b86b821562f';
const hasCover=url=>Boolean(url&&!url.includes(noCoverHash));
fallbackImage.onload=()=>draw(performance.now());fallbackImage.src='/fallback-sky.png';
hoverCover.addEventListener('error',()=>{if(hoverCover.dataset.fallbackApplied==='true')return;hoverCover.dataset.fallbackApplied='true';hoverCover.src='/fallback-sky.png'});
function imageFor(url){if(!hasCover(url))return null;if(!coverImages.has(url)){const image=new Image();image.onload=()=>draw(performance.now());image.onerror=()=>{image.failed=true;draw(performance.now())};coverImages.set(url,image);image.src=url.replace(/^http:/,'https:')}return coverImages.get(url)}
function resize(){layoutNodesForViewport();const r=sky.getBoundingClientRect(),ratio=window.devicePixelRatio||1;sky.width=Math.round(r.width*ratio);sky.height=Math.round(r.height*ratio);ctx.setTransform(ratio,0,0,ratio,0,0);draw(performance.now())}
function draw(time=performance.now()){const w=sky.clientWidth,h=sky.clientHeight;if(!w||!h)return;ctx.clearRect(0,0,w,h);const cx=w*.51,cy=h*.51;
const haze=ctx.createLinearGradient(w*.08,h*.9,w*.91,h*.12);haze.addColorStop(0,'rgba(153,125,75,0)');haze.addColorStop(.32,'rgba(180,151,92,.07)');haze.addColorStop(.5,'rgba(222,198,143,.12)');haze.addColorStop(.68,'rgba(148,130,84,.06)');haze.addColorStop(1,'rgba(153,125,75,0)');ctx.save();ctx.translate(cx,cy);ctx.rotate(-.43);ctx.fillStyle=haze;ctx.beginPath();ctx.ellipse(0,0,w*.7,h*.17,0,0,Math.PI*2);ctx.fill();ctx.restore();
ctx.save();ctx.translate(cx,cy);ctx.rotate(-.26+time/24000);ctx.strokeStyle='rgba(210,186,132,.13)';ctx.lineWidth=.65;for(let ring=1;ring<=9;ring++){const radius=ring/10;ctx.beginPath();ctx.ellipse(0,0,w*.46*radius,h*.45*radius,0,0,Math.PI*2);ctx.stroke()}ctx.strokeStyle='rgba(210,186,132,.1)';for(let ray=0;ray<48;ray++){const angle=ray*Math.PI/24;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(angle)*w*.46,Math.sin(angle)*h*.45);ctx.stroke()}const sweep=(time/9000)%(Math.PI*2);ctx.strokeStyle='rgba(244,215,156,.65)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(sweep)*w*.46,Math.sin(sweep)*h*.45);ctx.stroke();ctx.fillStyle='#f1d99f';ctx.shadowColor='#f1d99f';ctx.shadowBlur=14;ctx.beginPath();ctx.arc(Math.cos(sweep)*w*.46,Math.sin(sweep)*h*.45,3,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='rgba(225,201,148,.22)';ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(0,0,w*.46,h*.45,0,0,Math.PI*2);ctx.stroke();ctx.fillStyle='rgba(232,207,151,.55)';for(let tick=0;tick<180;tick++){const angle=tick*Math.PI/90,inner=tick%5===0?.445:.455,outer=.47;ctx.beginPath();ctx.moveTo(Math.cos(angle)*w*inner,Math.sin(angle)*h*inner);ctx.lineTo(Math.cos(angle)*w*outer,Math.sin(angle)*h*outer);ctx.stroke()}ctx.restore();
for(let k=0;k<520;k++){const x=(seed('star-x'+k)%10000)/10000*w,y=(seed('star-y'+k)%10000)/10000*h,band=Math.exp(-Math.pow((y-(h*.79-x*.56))/(h*.16),2)),bright=(.1+(k%5)*.08+band*.38)*(.72+.28*Math.sin(time/430+k*.73));ctx.fillStyle=`rgba(${k%7===0?'231,205,149':'238,232,215'},${Math.min(bright,.72)})`;ctx.beginPath();ctx.arc(x,y,k%29===0?1.35:.55,0,Math.PI*2);ctx.fill()}
const meteorPhase=(time%6200)/6200;if(meteorPhase<.17){const progress=meteorPhase/.17,startX=-w*.08,startY=h*.16,endX=w*.72,endY=h*.82,x=startX+(endX-startX)*progress,y=startY+(endY-startY)*progress,tail=ctx.createLinearGradient(x,y,x-w*.16,y-h*.16);tail.addColorStop(0,'rgba(255,235,184,.9)');tail.addColorStop(1,'rgba(255,235,184,0)');ctx.strokeStyle=tail;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x-w*.16,y-h*.16);ctx.lineTo(x,y);ctx.stroke();ctx.fillStyle='#fff4d2';ctx.shadowColor='#f0ce84';ctx.shadowBlur=16;ctx.beginPath();ctx.arc(x,y,2,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}
const motionTime=motionPreference.matches?0:time;positions=positionsAt(motionTime,w,h);const points=positions;ctx.strokeStyle='rgba(221,177,111,.23)';ctx.lineWidth=.8;for(let i=0;i<points.length-1;i++){const a=points[i],b=points[i+1];if(Math.hypot(a.x-b.x,a.y-b.y)<w*.33){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}}
points.forEach(({n,x,y})=>{
 const r=n.r,glow=ctx.createRadialGradient(x,y,r*.2,x,y,r*2.5);
 glow.addColorStop(0,'rgba(227,177,105,.24)');glow.addColorStop(1,'rgba(227,177,105,0)');
 ctx.fillStyle=glow;ctx.beginPath();ctx.arc(x,y,r*2.5,0,Math.PI*2);ctx.fill();
 ctx.save();ctx.translate(x,y);ctx.rotate((motionTime/18000+n.rotation)%(Math.PI*2));
 ctx.fillStyle='#070706';ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();
 const image=imageFor(n.cover),recordArt=image&&image.complete&&image.naturalWidth?image:fallbackImage;
 if(recordArt.complete&&recordArt.naturalWidth){
  ctx.save();ctx.beginPath();ctx.arc(0,0,r*.94,0,Math.PI*2);ctx.clip();
  ctx.drawImage(recordArt,-r*.94,-r*.94,r*1.88,r*1.88);ctx.restore();
 }else{ctx.fillStyle=n.color;ctx.beginPath();ctx.arc(0,0,r*.94,0,Math.PI*2);ctx.fill()}
 ctx.globalAlpha=.34;ctx.strokeStyle='#e2d2ad';ctx.lineWidth=Math.max(.45,r*.012);
 for(let groove=0;groove<5;groove++){ctx.beginPath();ctx.arc(0,0,r*(.52+groove*.085),0,Math.PI*2);ctx.stroke()}
 ctx.globalAlpha=1;ctx.strokeStyle='rgba(239,216,174,.75)';ctx.lineWidth=1;
 ctx.beginPath();ctx.arc(0,0,r*.98,0,Math.PI*2);ctx.stroke();
 ctx.fillStyle='#211a13';ctx.beginPath();ctx.arc(0,0,Math.max(1,r*.035),0,Math.PI*2);ctx.fill();
 ctx.restore();ctx.fillStyle='#eee1cb';ctx.font=`${Math.max(9,Math.min(12,r*.43))}px Georgia`;
 ctx.textAlign='center';ctx.shadowColor='#100f0c';ctx.shadowBlur=5;
 let label=n.artist;while(label.length>4&&ctx.measureText(label).width>(n.labelWidth||120))label=`${label.slice(0,-2)}…`;ctx.fillText(label,x,y+r+15);ctx.shadowBlur=0
})}
function showArtist(n){document.getElementById('status').textContent=`${n.artist} — ${n.count} of your latest ${tracks.length} plays. ${n.titles.slice(0,4).join(' · ')}`}
function layoutNodesForViewport(){if(!nodes.length)return;const compact=window.matchMedia('(max-width: 650px)').matches,width=sky.clientWidth||scene.clientWidth;if(!width)return;const heightLimit=compact?Infinity:Math.max(240,window.innerHeight-40),topSpace=compact?46:20,bottomSpace=compact?52:24;let maxRadius=compact?Math.min(24,width*.075):Math.min(58,width*.045);let columns=1,rows=nodes.length,xStep=0,yStep=0;for(;maxRadius>=18;maxRadius-=1){xStep=maxRadius*2+16;yStep=xStep*.87;columns=Math.max(1,Math.floor((width-2*maxRadius-8)/xStep));if(!compact&&columns>1&&columns%2===0)columns--;const firstRowColumns=compact&&columns%2===0?columns-1:columns;rows=compact?1+Math.ceil(Math.max(0,nodes.length-firstRowColumns)/columns):Math.ceil(nodes.length/columns);if(!compact&&rows%2===0)rows++;if(compact||rows*yStep+maxRadius*2+topSpace+bottomSpace<=heightLimit)break}const height=compact?Math.max(520,rows*yStep+maxRadius*2+topSpace+bottomSpace):heightLimit;scene.style.height=compact?`${height}px`:'';const centerX=width/2,centerY=compact?topSpace+maxRadius+12:height/2,candidates=[];for(let row=0;row<rows;row++){const rowColumns=compact&&row===0&&columns%2===0?columns-1:columns,stagger=compact?(row%2?xStep*.5:0):(Math.abs(row-(rows-1)/2)%2?xStep*.5:0);for(let column=0;column<rowColumns;column++){const x=centerX+(column-(rowColumns-1)/2)*xStep+stagger,y=compact?centerY+row*yStep:centerY+(row-(rows-1)/2)*yStep;if(x>=maxRadius+4&&x<=width-maxRadius-4&&y>=maxRadius+topSpace&&y<=height-maxRadius-bottomSpace)candidates.push({x,y,distance:Math.hypot(x-centerX,y-centerY)})}}if(candidates.length<nodes.length)throw new Error('Unable to fit all listening records in the galaxy.');candidates.sort((a,b)=>a.distance-b.distance||a.y-b.y||a.x-b.x);const byRecency=[...nodes].sort((a,b)=>b.latestTimestamp-a.latestTimestamp||a.artist.localeCompare(b.artist));byRecency.forEach((n,i)=>{const spot=candidates[i];n.anchorX=spot.x;n.anchorY=spot.y;n.r=Math.min(maxRadius,Math.max(compact?16:24,maxRadius*(.72+.28*Math.sqrt(n.count/(n.maxCount||1)))));n.labelWidth=compact?xStep-8:120})}
function positionsAt(time,w,h){const compact=window.matchMedia('(max-width: 650px)').matches,windX=compact?3:18,windY=compact?3:20,points=nodes.map(n=>({n,x:n.anchorX+Math.sin(time/6500+n.motionPhase)*windX+Math.sin(time/11000+n.motionPhase*1.7)*windX*.5,y:n.anchorY+Math.cos(time/7900+n.motionPhase*1.3)*windY+Math.sin(time/13000+n.motionPhase*.8)*windY*.5}));for(let pass=0;pass<3;pass++){for(let i=0;i<points.length;i++){for(let j=i+1;j<points.length;j++){const a=points[i],b=points[j],dx=b.x-a.x,dy=b.y-a.y,distance=Math.hypot(dx,dy),minimum=a.n.r+b.n.r+5;if(distance>=minimum)continue;const angle=distance?Math.atan2(dy,dx):((seed(a.n.artist+b.n.artist)%628)/100),push=(minimum-distance)/2,offsetX=Math.cos(angle)*push,offsetY=Math.sin(angle)*push;a.x-=offsetX;a.y-=offsetY;b.x+=offsetX;b.y+=offsetY}}}points.forEach(point=>{point.x=Math.max(point.n.r+2,Math.min(w-point.n.r-2,point.x));point.y=Math.max(point.n.r+2,Math.min(h-point.n.r-2,point.y))});return points}
function nodeDistance(clientX,clientY,n){const rect=sky.getBoundingClientRect(),position=positions.find(point=>point.n===n);return position?Math.hypot(clientX-rect.left-position.x,clientY-rect.top-position.y):Infinity}
function nodeAt(clientX,clientY){return positions.map(point=>({n:point.n,d:Math.hypot(clientX-sky.getBoundingClientRect().left-point.x,clientY-sky.getBoundingClientRect().top-point.y)})).sort((a,b)=>a.d-b.d)[0]?.n}
function setHoverCard(node,clientX,clientY){if(!node){activeNode=null;hoverCard.classList.remove('visible');return}if(activeNode!==node){activeNode=node;hoverCover.dataset.fallbackApplied='false';document.querySelector('.hover-kicker').textContent='Now in orbit';document.getElementById('hover-title').textContent=node.latestTrack?.title||node.titles[0]||'Recent listen';document.getElementById('hover-artist').textContent=node.artist;document.getElementById('hover-album').textContent=node.latestTrack?.album||'';const cover=imageFor(node.cover);hoverCover.src=cover&&!cover.failed?cover.src:'/fallback-sky.png';hoverCover.alt=cover&&!cover.failed?`Album cover for ${node.artist}`:''}hoverCard.classList.add('visible');const rect=scene.getBoundingClientRect(),cardWidth=hoverCard.offsetWidth,cardHeight=hoverCard.offsetHeight;hoverCard.style.left=`${Math.max(12,Math.min(clientX-rect.left+22,rect.width-cardWidth-12))}px`;hoverCard.style.top=`${Math.max(12,Math.min(clientY-rect.top+18,rect.height-cardHeight-12))}px`}
function moveCursor(event){const rect=scene.getBoundingClientRect(),x=event.clientX-rect.left,y=event.clientY-rect.top;cursorAura.style.left=`${x}px`;cursorAura.style.top=`${y}px`;cursorAura.classList.add('visible');cursorSparks.forEach((spark,i)=>{const angle=i*2.1+performance.now()/900,distance=11+i*7;spark.style.left=`${x+Math.cos(angle)*distance}px`;spark.style.top=`${y+Math.sin(angle)*distance}px`;spark.classList.add('visible')});const node=nodeAt(event.clientX,event.clientY);if(node&&nodeDistance(event.clientX,event.clientY,node)<node.r+10){setHoverCard(node,event.clientX,event.clientY);sky.style.cursor='none'}else if(!pinnedCard){setHoverCard(null);sky.style.cursor='none'}}
scene.addEventListener('pointermove',event=>{if(event.pointerType==='mouse'||event.pointerType==='pen')moveCursor(event)});
scene.addEventListener('pointerleave',()=>{cursorAura.classList.remove('visible');cursorSparks.forEach(spark=>spark.classList.remove('visible'));if(!pinnedCard)setHoverCard(null)});
scene.addEventListener('pointerdown',event=>{if(event.pointerType==='touch'){const node=nodeAt(event.clientX,event.clientY);if(node&&nodeDistance(event.clientX,event.clientY,node)<node.r+14){pinnedCard=true;setHoverCard(node,event.clientX,event.clientY);showArtist(node)}else{pinnedCard=false;setHoverCard(null)}}});
scene.addEventListener('click',event=>{if(event.pointerType==='touch')return;const node=nodeAt(event.clientX,event.clientY);if(node&&nodeDistance(event.clientX,event.clientY,node)<node.r+14){showArtist(node);setHoverCard(node,event.clientX,event.clientY)}else{pinnedCard=false;setHoverCard(null)}});
function render(data){tracks=data.tracks;document.getElementById('username').textContent='@'+data.username;
const groups=new Map();tracks.forEach(t=>{const artist=t.artist||'Unknown';if(!groups.has(artist))groups.set(artist,{artist,count:0,titles:[],cover:'',latestTrack:null,latestTimestamp:-1});const group=groups.get(artist);group.count++;const timestamp=t.now_playing?Number.MAX_SAFE_INTEGER:t.timestamp||0;if(!group.latestTrack||timestamp>group.latestTimestamp){group.latestTimestamp=timestamp;group.latestTrack=t}if(!group.titles.includes(t.title))group.titles.push(t.title);if(!group.cover&&t.cover)group.cover=t.cover});const arr=[...groups.values()].sort((a,b)=>b.count-a.count),maxCount=Math.max(1,...arr.map(artist=>artist.count));
nodes=arr.map(artist=>({...artist,maxCount,r:0,anchorX:0,anchorY:0,labelWidth:120,rotation:seed(artist.artist)%628/100,motionPhase:seed(artist.artist)%628/100,color:['#d4a65d','#b87054','#7e9a87','#bd956e','#758c9d'][seed(artist.artist)%5]}));layoutNodesForViewport();draw();document.getElementById('status').textContent=tracks.length?data.stale?'Last.fm temporarily unavailable — showing cached listens.':'Your galaxy is up to date.':'No recent tracks found. Play some music and refresh.';startAnimation()}
function startAnimation(){if(!motionPreference.matches&&!document.hidden&&!animationFrame)animationFrame=requestAnimationFrame(animate)}
function animate(time){animationFrame=0;if(motionPreference.matches||document.hidden)return;if(time-lastFrame>=40){draw(time);lastFrame=time}startAnimation()}
async function load(){try{const resp=await fetch('/api/tracks');const data=await resp.json();if(!resp.ok)throw Error(data.error||'API unavailable');render(data)}catch(err){document.getElementById('status').textContent=`Could not load your music: ${err.message}`}}
window.addEventListener('resize',resize);new ResizeObserver(resize).observe(sky);document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(animationFrame);animationFrame=0}else{draw(performance.now());startAnimation()}});motionPreference.addEventListener('change',()=>{lastFrame=0;if(motionPreference.matches){cancelAnimationFrame(animationFrame);animationFrame=0;draw(performance.now())}else startAnimation()});resize();load();
</script></body></html>
