services:
  site:
    ports: !reset []
    restart: unless-stopped
  api:
    restart: unless-stopped
  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    networks:
      - default
      - visit-counter
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:

networks:
  visit-counter:
    external: true
    name: visit-counter-_default
